<form (ngSubmit)="onSubmit()" style="padding-left: 40%;">
    <div>
        <input [(ngModel)]="email" name="email" placeholder="email" required autocomplete="off"/>
    </div>
    <div>
        <input [(ngModel)]="password" name="password" type="password" placeholder="password" required />
    </div>
    <button type="submit" style="background-color: #F26530;">Login</button>
</form>
