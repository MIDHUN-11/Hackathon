<form (ngSubmit)="onSubmit()" style="padding-left: 40%;">
    <div>
        <input [(ngModel)]="email" name="email" placeholder="enter email" required />
    </div>
    <div>
        <input [(ngModel)]="password" name="password" type="password" placeholder="enter password" required />
    </div>
    <button type="submit">Login</button>
</form>
